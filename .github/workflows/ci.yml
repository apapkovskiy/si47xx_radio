name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv8m.main-none-eabihf, x86_64-unknown-linux-gnu

      - name: Build Host
        run: cargo build --features host --no-default-features --target x86_64-unknown-linux-gnu

      - name: Build Arm
        run: cargo build --features "nrf5340dk" --no-default-features --target=thumbv8m.main-none-eabihf

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy nrf5340dk
        run: cargo clippy --features "nrf5340dk" --no-default-features --target=thumbv8m.main-none-eabihf -- -D warnings -W clippy::large_stack_frames

      - name: Clippy nrf7002dk
        run: cargo clippy --features "nrf7002dk" --no-default-features --target=thumbv8m.main-none-eabihf -- -D warnings -W clippy::large_stack_frames

      - name: Clippy Host
        run: cargo clippy --features host --no-default-features --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Docs
        run: cargo doc --features host --no-default-features --no-deps --target x86_64-unknown-linux-gnu
