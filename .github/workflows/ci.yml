name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv8m.main-none-eabihf, x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy Arm
        run: cargo clippy -- -D warnings

      - name: Clippy Host
        run: cargo clippy --features host --no-default-features --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Docs
        run: cargo doc
